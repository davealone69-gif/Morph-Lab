name: MORPH LAB build and smoke test

on:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morph-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Typecheck, tests, production build, browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Upload production web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morph-lab-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Install Chromium for browser smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm smoke

      - name: Upload browser smoke screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morph-lab-smoke-screenshots
          path: shots/
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web game for offline APK
        run: pnpm build

      - name: Bundle game assets into Android app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morph-lab-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
