name: MORPH LAB build and smoke test

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morph-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Typecheck, tests, production build, browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium for browser smoke test
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm smoke

      - name: Upload built web app and smoke screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: morph-lab-web-build
          path: |
            dist/
            shots/
          if-no-files-found: error
          retention-days: 14
